name: Deploy Jupyter Book site to GitHub Pages

on:
  push:
    branches:
      - main
  # Permite disparar o workflow manualmente pela aba Actions
  workflow_dispatch:

env:
  # Este repositório é um "user site" (fabioolp.github.io), servido na raiz do
  # domínio. Por isso o BASE_URL é vazio.
  # Em um "project site" seria: BASE_URL: /${{ github.event.repository.name }}
  BASE_URL: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Permite um deploy concorrente por vez, sem cancelar execuções em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2"

      - name: Build HTML assets
        run: jupyter book build --html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
